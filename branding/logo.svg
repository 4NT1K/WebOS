<?xml version="1.0" encoding="UTF-8"?>
<!-- WebOS logo mark: a black disc, an ice-blue diagonal, one point. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="disc" cx="50%" cy="42%" r="62%">
      <stop offset="0%"   stop-color="#14161a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="diag" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="1"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="128" cy="128" r="112" fill="url(#disc)" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="128" cy="128" r="96"  fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <g filter="url(#glow)">
    <line x1="86" y1="170" x2="170" y2="86" stroke="url(#diag)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="128" cy="128" r="7" fill="#7dd3fc"/>
  </g>

  <path d="M 52 52 h 22 M 52 52 v 22"   stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none"/>
  <path d="M 204 204 h -22 M 204 204 v -22" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2" fill="none"/>
</svg>
