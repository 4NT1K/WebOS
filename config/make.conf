# /etc/portage/make.conf — WebOS 1.0 (Ashen)
# Generated by the WebOS build system. Edit /etc/portage/make.conf.d/ for
# local changes; this file is owned by the distro and is replaced on upgrade.

# ---------------------------------------------------------------- target -----
# x86-64-v3 (Haswell/Zen1+): the same baseline CachyOS uses for its "v3" builds.
# For older CPUs switch to -march=x86-64-v2; for a native build use -march=native.
COMMON_FLAGS="-march=x86-64-v3 -O2 -pipe -fno-semantic-interposition"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=x86-64-v3"
# LTO is available but off by default: it doubles build time for a few percent.
# Uncomment for a "WebOS Full Send" build.
#COMMON_FLAGS="${COMMON_FLAGS} -flto=auto"

MAKEOPTS="-j16 -l24"
EMERGE_DEFAULT_OPTS="--jobs=16 --load-average=24 --quiet-build=y --with-bdeps=y --complete-graph=y --keep-going=y --nospinner"

# --------------------------------------------------------------- features ----
FEATURES="parallel-fetch parallel-install split-log -binpkg-multi-instance"
# WebOS ships source-only by default. Turn on buildpkg to keep a local cache:
#FEATURES="${FEATURES} buildpkg"
#FEATURES="${FEATURES} ccache"
PORTAGE_TMPDIR="/var/tmp"
PORTAGE_ELOG_CLASSES="warn error log"
PORTAGE_ELOG_SYSTEM="save"

# --------------------------------------------------------------- mirrors -----
GENTOO_MIRRORS="https://distfiles.gentoo.org https://mirror.leaseweb.com/gentoo"
# Binhost is off: WebOS is a source distro.
#BINHOST=""

# ------------------------------------------------------------------ use ------
# Gaming desktop, Wayland, no systemd. Trimmed to what we actually ship.
USE="X wayland elogind dbus policykit udev udisks \
     pipewire pulseaudio alsa bluetooth networkmanager \
     opengl vulkan egl gbm vaapi vdpau nvenc opencl \
     ffmpeg truetype fontconfig harfbuzz icu \
     png jpeg webp tiff gif svg \
     zstd lz4 bzip2 xz zlib lzo \
     ssl openssl curl git gcrypt \
     threads ncurses readline pcre2 \
     -systemd -gnome -kde -doc -test -debug -wayland-compositor \
     -gtk-doc -handbook -html -man -info -cups -samba -ldap -kerberos"

# Per-package tuning lives in /etc/portage/package.use/*.

# --------------------------------------------------------------- expands -----
VIDEO_CARDS="amdgpu radeonsi intel"
# NVIDIA proprietary:
#VIDEO_CARDS="nvidia"
# NVIDIA proprietary + AMD/Intel iGPU (hybrid laptops):
#VIDEO_CARDS="nvidia amdgpu radeonsi intel"

# x86-64-v3 feature set. `cpuid2cpuflags` can regenerate this per machine.
CPU_FLAGS_X86="aes avx avx2 avx512f avx512dq avx512cd avx512bw avx512vl \
               f16c fma3 mmx mmxext pclmul popcnt rdrand sha sse sse2 sse3 \
               sse4_1 sse4_2 ssse3 vpclmulqdq"

# --------------------------------------------------------------- platform ----
GRUB_PLATFORMS="efi-64 pc"
# Systemd-boot alternative:
#GRUB_PLATFORMS=""

ABI_X86="64"
BOOTSTRAP_USE=""
LINGUAS="en"
L10N="en"
# `L10N="en de fr"` etc. also installs translations for those locales.

# ---------------------------------------------------------------- accept -----
ACCEPT_LICENSE="@FREE @BINARY-REDISTRIBUTABLE"
# WebOS is a rolling, gaming-focused distro; use testing keywords to reduce
# blocks for fast-moving packages and third-party overlays during builds.
ACCEPT_KEYWORDS="~amd64"

# --------------------------------------------------------------- sanity ------
# Do not let portage touch the live system's kernel sources during builds.
PORTDIR="/var/db/repos/gentoo"
DISTDIR="/var/cache/distfiles"
PKGDIR="/var/cache/binpkgs"

# WebOS marker, read by ebuilds that want to behave differently.
WEBOS_OS="1"
WEBOS_VERSION="1.13"
