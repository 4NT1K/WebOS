# Repo priority (higher wins): sanus 100 > gentoo -1000 > third-party -2000.
# The master tree wins over the third-party overlays so they are only ever
# consulted for packages ::gentoo does not carry.
[DEFAULT]
main-repo = gentoo

[gentoo]
location = /var/db/repos/gentoo
sync-type = rsync
sync-uri = rsync://rsync.gentoo.org/gentoo-portage
auto-sync = yes
priority = -1000
