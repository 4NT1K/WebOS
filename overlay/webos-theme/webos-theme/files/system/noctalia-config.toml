# ─────────────────────────────────────────────────────────────────────────────
#  WebOS Noctalia — dark, pure black, monochrome, square.
#  Seeded to ~/.config/noctalia/config.toml by `webos-session --noctalia`.
#  Noctalia merges this over its defaults, so only differences belong here.
#  Full reference: https://docs.noctalia.dev/noctalia/configuration
# ─────────────────────────────────────────────────────────────────────────────

[shell]
corner_radius_scale   = 0.0
font_family           = "MesloLGM Nerd Font Mono"
telemetry_enabled     = false
offline_mode          = false
polkit_agent          = true          # the shell's own agent; webos-portals skips its own
clipboard_enabled     = true

[theme]
mode            = "dark"
source          = "builtin"
builtin         = "Noctalia"
pure_black_dark = true

[backdrop]
enabled        = true
blur_intensity = 0.4
tint_intensity = 0.2

[wallpaper]
enabled              = true
fill_mode            = "crop"
transition_on_startup = false

[wallpaper.default]
path = "/usr/share/webos/wallpaper/webos-wallpaper.png"

[notification]
enable_daemon      = true
background_opacity = 0.95
border             = true
layer              = "overlay"

[bar.main]
position           = "top"
thickness          = 36
background_opacity = 0.55
compositor_blur    = true
radius             = 0
margin_ends        = 0
margin_edge        = 0
padding            = 12
widget_spacing     = 6
shadow             = false
reserve_space      = true
capsule            = false
start              = ["launcher", "workspaces"]
center             = ["clock", "media"]
end                = ["tray", "network", "volume", "battery", "control-center", "session"]

[dock]
enabled = false
