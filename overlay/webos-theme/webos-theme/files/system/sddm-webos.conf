# Default session for the live medium and for fresh installs. The installer's
# /var/lib/sddm/state.conf overrides this with the session chosen at install
# time.
#
# DisplayServer is deliberately not set here: it selects the *greeter's*
# backend (Gentoo's 01gentoo.conf keeps the stable X11 greeter), not the
# user's session, which is Wayland (webos.desktop).
[Users]
DefaultSession=webos.desktop
