# ─────────────────────────────────────────────────────────────────────────────
#  WebOS mono — kitty, grayscale, flat.
#  ~/.config/kitty/kitty.conf
# ─────────────────────────────────────────────────────────────────────────────

font_family      MesloLGM Nerd Font Mono
bold_font        MesloLGM Nerd Font Mono Bold
italic_font      MesloLGM Nerd Font Mono Italic
bold_italic_font MesloLGM Nerd Font Mono Bold Italic
font_size        11.0
adjust_line_height 115%

# Flat charcoal, slightly translucent. No blur, no tint.
background            #212529
foreground            #f8f9fa
background_opacity    0.94
dynamic_background_opacity yes
background_blur       0

# ── Greyscale palette ───────────────────────────────────────────────────────
selection_foreground #212529
selection_background #dee2e6
cursor               #f8f9fa
cursor_text_color    #212529
url_color            #f8f9fa

color0  #212529
color1  #495057
color2  #6c757d
color3  #adb5bd
color4  #ced4da
color5  #dee2e6
color6  #e9ecef
color7  #f8f9fa
color8  #343a40
color9  #5a6268
color10 #7d858c
color11 #b8bfc5
color12 #d6dbdf
color13 #e4e8eb
color14 #f0f2f4
color15 #ffffff

# ── Window ──────────────────────────────────────────────────────────────────
hide_window_decorations yes
window_padding_width 18
window_margin_width 0
confirm_os_window_close 0
remember_window_size yes
initial_window_width  1100
initial_window_height 680

# ── Behaviour ───────────────────────────────────────────────────────────────
scrollback_lines 10000
enable_audio_bell no
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 2.0
focus_follows_mouse no
detect_urls yes
open_url_with default
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
active_tab_background   #343a40
inactive_tab_background #212529
active_tab_foreground   #ffffff
inactive_tab_foreground #adb5bd

# ── Cursor ──────────────────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.2
cursor_blink_interval 0

# ── Performance ─────────────────────────────────────────────────────────────
repaint_delay 8
input_delay 2
sync_to_monitor yes

# ── Shortcuts ───────────────────────────────────────────────────────────────
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# Show the WebOS fastfetch card on every new interactive kitty window.
shell /usr/bin/webos-shell
