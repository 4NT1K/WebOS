# WebOS hyprsunset — neutral, always.
# ~/.config/hypr/hyprsunset.conf

# One neutral profile: no evening warm-up. `gamma` is a multiplier, so 1.0 is
# 100 % (hyprsunset's max-gamma default). Larger values are clamped.
profile {
    time = 00:00
    identity = true
    temperature = 6500
    gamma = 1.0
}
