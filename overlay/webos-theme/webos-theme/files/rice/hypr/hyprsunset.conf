# WebOS hyprsunset — warm the display in the evening, quietly.
# ~/.config/hypr/hyprsunset.conf

# Night light: 3500 K from 21:00, back to neutral at 07:00.
profile {
    time = 21:00
    identity = false
    temperature = 3500
    gamma = 90
}

profile {
    time = 07:00
    identity = true
    temperature = 6500
    gamma = 100
}
