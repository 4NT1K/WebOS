# ─────────────────────────────────────────────────────────────────────────────
#  WebOS hyprlock — a black blur over whatever you were doing.
#  ~/.config/hypr/hyprlock.conf
# ─────────────────────────────────────────────────────────────────────────────

general {
    hide_cursor = true
    grace       = 0
    no_fade_in  = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size   = 12
    noise       = 0.018
    contrast    = 1.02
    brightness  = 0.45
    vibrancy    = 0.15
    color       = rgba(000000eb)
}

# Subtle vignette so the black feels intentional, not flat.
background {
    monitor =
    path = /usr/share/webos/wallpaper/webos-wallpaper.png
    color = rgba(00000000)
    blur_passes = 0
    brightness = 0.30
}

# ── Clock ───────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(216, 216, 216, 0.95)
    font_size = 108
    font_family = Inter ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(122, 122, 122, 0.85)
    font_size = 17
    font_family = Inter Medium
    position = 0, 40
    halign = center
    valign = center
}

# ── Identity ────────────────────────────────────────────────────────────────
label {
    monitor =
    text =  $USER
    color = rgba(232, 232, 232, 0.9)
    font_size = 15
    font_family = Inter SemiBold
    position = 0, -120
    halign = center
    valign = center
}

image {
    monitor =
    path = /usr/share/webos/logo.svg
    size = 84
    position = 0, -190
    halign = center
    valign = center
}

# ── Password ────────────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.30
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(232, 232, 232, 0.20)
    inner_color = rgba(0, 0, 0, 0.92)
    font_color = rgba(216, 216, 216, 1.0)
    font_family = JetBrainsMono Nerd Font
    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##7A7A7A">enter password…</span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_color = rgba(248, 113, 113, 0.9)
    check_color = rgba(232, 232, 232, 0.9)
    capslock_color = rgba(251, 191, 36, 0.9)
    position = 0, -320
    halign = center
    valign = center
}

# ── Footer ──────────────────────────────────────────────────────────────────
label {
    monitor =
    text = WebOS
    color = rgba(122, 122, 122, 0.8)
    font_size = 11
    font_family = Inter Medium
    position = 0, -40
    halign = center
    valign = bottom
}
