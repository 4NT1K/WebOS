# WebOS hypridle — idle actions disabled.
# ~/.config/hypr/hypridle.conf
#
# No listener is active: the desktop will not dim, lock, blank or suspend
# while idle. Lock manually with Super+Escape or from the power menu.

general {
    lock_cmd        = pidof hyprlock || hyprlock --grace 0 --no-fade-in
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
    ignore_dbus_inhibit = false
}

