# WebOS hypridle — dim, lock, then suspend. Gentle by default.
# ~/.config/hypr/hypridle.conf

general {
    lock_cmd        = pidof hyprlock || hyprlock --grace 0 --no-fade-in
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
    ignore_dbus_inhibit = false
}

# 2.5 min: dim real backlights only. The desktop has keyboard LEDs in
# /sys/class/leds, and plain `brightnessctl -s set` used to dim those too.
listener {
    timeout = 150
    on-timeout = find /sys/class/backlight -mindepth 1 -maxdepth 1 -print -quit | grep -q . && brightnessctl -c backlight -s set 15%
    on-resume  = find /sys/class/backlight -mindepth 1 -maxdepth 1 -print -quit | grep -q . && brightnessctl -c backlight -r
}

# 5 min: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 min: blank the display.
listener {
    timeout = 600
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    on-resume  = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}

# 20 min: suspend.
listener {
    timeout = 1200
    on-timeout = loginctl suspend
}

# Fullscreen games and video players hold a D-Bus idle inhibitor. hypridle
# honours it by default (ignore_dbus_inhibit = false), so no extra listener is
# needed — the old "check activewindow every minute" listener could not
# actually inhibit anything.
