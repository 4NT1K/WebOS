# WebOS hyprpaper — static wallpaper, generated by webos-wallpaper.
# ~/.config/hypr/hyprpaper.conf

preload = /usr/share/webos/wallpaper/webos-wallpaper.png
preload = /usr/share/webos/wallpaper/webos-wallpaper-dark.png

wallpaper = ,/usr/share/webos/wallpaper/webos-wallpaper.png

splash = false
ipc = on
