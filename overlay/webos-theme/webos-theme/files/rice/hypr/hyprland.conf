# ─────────────────────────────────────────────────────────────────────────────
#  WebOS — Hyprland
#  Black, translucent, blurred. Rounded, quiet, fast.
#
#  This file is installed to ~/.config/hypr/hyprland.conf by `webos-rice`.
#  Edit it freely — `webos-rice` will not overwrite a file you have modified
#  unless you pass --force.
# ─────────────────────────────────────────────────────────────────────────────

source = ~/.config/hypr/webos-colors.conf

# ── Programs ────────────────────────────────────────────────────────────────
$terminal   = kitty
$terminal2  = foot
$editor     = nvim
$fileman    = dolphin
$browser    = firefox
$menu       = wofi --show drun
$settings   = systemsettings
$wallpaper  = webos-wallpaper

# ── Autostart ───────────────────────────────────────────────────────────────
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment 2>/dev/null || true
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1 2>/dev/null || lxqt-policykit-agent 2>/dev/null || true
exec-once = hypridle
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprctl setcursor Breeze_Light 24
exec-once = sh -c 'webos-rice --ensure 2>/dev/null || true'
exec-once = $wallpaper --daemon

# ── Environment ─────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Breeze_Light
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland,x11
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = _JAVA_AWT_WM_NONREPARENTING,1
# env = LIBVA_DRIVER_NAME,radeonsi  # uncomment for AMD
# env = VDPAU_DRIVER,radeonsi
# NVIDIA users: comment the two lines above and uncomment these.
#env = LIBVA_DRIVER_NAME,nvidia
#env = GBM_BACKEND,nvidia-drm
#env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = EDITOR,nvim
env = BROWSER,firefox

# ── Monitors ────────────────────────────────────────────────────────────────
# Auto-detect; edit for HiDPI or multi-monitor layouts.
monitor = , preferred, auto, 1
# Example: internal 1.5x, external 144 Hz to the right.
#monitor = eDP-1, 2880x1800@120, 0x0, 1.5
#monitor = DP-1, 2560x1440@144, 2880x0, 1

# ── Look ────────────────────────────────────────────────────────────────────
general {
    gaps_in              = 6
    gaps_out             = 14
    border_size          = 2
    col.active_border    = $accent_glow rgba(ffffff26) 40deg
    col.inactive_border  = $border
    resize_on_border     = true
    allow_tearing        = false
    layout               = dwindle
}

decoration {
    rounding            = 14
    rounding_power      = 2
    active_opacity      = 1.0
    inactive_opacity    = 0.90
    fullscreen_opacity  = 1.0

    blur {
        enabled           = true
        size              = 7
        passes            = 3
        new_optimizations = true
        xray              = false
        noise             = 0.02
        contrast          = 1.05
        brightness        = 0.82
        vibrancy          = 0.18
        vibrancy_darkness = 0.35
        popups            = true
        input_methods     = true
        special           = true
    }

    shadow {
        enabled      = true
        range        = 28
        render_power = 3
        color        = rgba(000000bb)
    }

    dim_inactive  = true
    dim_strength  = 0.14
}

animations {
    enabled          = true
    bezier           = ease,     0.25, 0.10, 0.25, 1.0
    bezier           = snappy,   0.10, 0.90, 0.20, 1.0
    bezier           = glide,    0.16, 0.84, 0.30, 1.0
    animation        = global,     1, 4, glide
    animation        = border,     1, 5, ease
    animation        = windows,    1, 4, snappy, popin 94%
    animation        = windowsIn,  1, 4, snappy, popin 94%
    animation        = windowsOut, 1, 3, ease,   popin 96%
    animation        = fade,       1, 3, ease
    animation        = layers,     1, 3, ease,   fade
    animation        = fadeLayers, 1, 3, ease
    animation        = workspaces, 1, 4, glide,  fade
}

dwindle {
    pseudotile          = true
    preserve_split      = true
    smart_split         = false
    smart_resizing      = true
    special_scale_factor = 0.98
}

master {
    new_status      = master
    mfact           = 0.55
    special_scale_factor = 0.98
}

misc {
    disable_hyprland_logo     = true
    disable_splash_rendering  = true
    force_default_wallpaper   = 0
    vfr                       = true
    vrr                       = 0
    mouse_move_enables_dpms   = true
    key_press_enables_dpms    = true
    focus_on_activate         = true
    animate_manual_resizes    = false
    animate_mouse_windowdragging = false
    enable_swallow            = true
    swallow_regex             = ^(kitty|foot|wezterm|Alacritty)$
    middle_click_paste        = false
    layers_hog_keyboard_focus = true
    initial_workspace_tracking = 1
}

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles   = true
    pass_mouse_when_bound    = false
}

# ── Per-window polish ───────────────────────────────────────────────────────
# Terminals and anything that opts in get the translucent treatment.
windowrulev2 = opacity 0.88 0.82, class:^(kitty)$
windowrulev2 = opacity 0.86 0.80, class:^(foot)$
windowrulev2 = opacity 0.90 0.85, class:^(Alacritty)$
windowrulev2 = opacity 0.92 0.88, class:^(wezterm)$
windowrulev2 = opacity 0.94 0.90, class:^(org.gnome.Nautilus|pcmanfm|Thunar)$
windowrulev2 = opacity 0.95 0.92, class:^(firefox|zen|chromium)$
windowrulev2 = opacity 0.97 0.95, class:^(mpv|imv|swayimg)$

# Utilities should not be transparent at all.
windowrulev2 = opacity 1.0 override 1.0, class:^(pavucontrol|blueman-manager|nm-connection-editor|kvantummanager|qt6ct|qt5ct)$
windowrulev2 = opacity 1.0 override, class:^(xdg-desktop-portal-gtk)$

# Steam and games: opaque, no blur, no rounding, no shadows. Frames first.
windowrulev2 = opacity 1.0 override 1.0, class:^(steam)$
windowrulev2 = opacity 1.0 override 1.0, class:^(gamescope)$
windowrulev2 = opacity 1.0 override 1.0, class:^(cs2|dota2|hl2_linux|wine|.*\.exe)$
windowrulev2 = noshadow, class:^(steam|gamescope|wine)$
windowrulev2 = noblur,   class:^(steam|gamescope|wine)$
windowrulev2 = norounding, class:^(gamescope)$
windowrulev2 = immediate, class:^(gamescope)$
windowrulev2 = fullscreen, class:^(gamescope)$
windowrulev2 = idleinhibit fullscreen, class:^(.*)$

# Float the small stuff.
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor|file-roller|xdg-desktop-portal-gtk)$
windowrulev2 = size 60% 65%, class:^(pavucontrol)$
windowrulev2 = size 70% 70%, class:^(blueman-manager)$
windowrulev2 = center, class:^(pavucontrol|blueman-manager|nm-connection-editor)$

# Picture-in-picture, dialogs.
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 30% 30%, title:^(Picture-in-Picture)$
windowrulev2 = move 69% 6%, title:^(Picture-in-Picture)$
windowrulev2 = suppressevent maximize, class:^(.*)$

# ── Blur the panels and launchers ───────────────────────────────────────────
layerrule = blur, waybar
layerrule = ignorealpha 0.25, waybar
layerrule = blur, wofi
layerrule = ignorealpha 0.25, wofi
layerrule = blur, notifications
layerrule = ignorealpha 0.25, notifications
layerrule = blur, logout_dialog
layerrule = ignorealpha 0.25, logout_dialog
layerrule = blur, selection
layerrule = ignorealpha 0.25, selection

# ── Binds ───────────────────────────────────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod SHIFT, Return, exec, $terminal2
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, E, exec, $fileman
bind = $mod, B, exec, $browser
bind = $mod, D, exec, $menu
bind = $mod, R, exec, wofi --show run
bind = $mod, I, exec, $settings
bind = $mod, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
bind = $mod, Escape, exec, hyprlock
bind = $mod, P, exec, webos-rice --toggle-panel
bind = $mod, N, exec, makoctl dismiss -a
bind = $mod, F, togglefloating,
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, Space, fullscreen, 0
bind = $mod CTRL, J, togglesplit,
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Move focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize
bind = $mod CTRL, left,  resizeactive, -40 0
bind = $mod CTRL, right, resizeactive,  40 0
bind = $mod CTRL, up,    resizeactive,  0 -40
bind = $mod CTRL, down,  resizeactive,  0  40

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1
bind = $mod, Tab, workspace, previous

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, mouse:274, togglefloating,

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshots (webos-shot wraps grim/slurp; no extra package needed)
bind = , Print, exec, webos-shot region --clipboard
bind = SHIFT, Print, exec, webos-shot window --clipboard
bind = $mod, Print, exec, webos-shot output --clipboard
bind = $mod SHIFT, Print, exec, webos-shot region --save

# Gaming helpers
bind = $mod, G, exec, webos-gaming status
bind = $mod SHIFT, G, exec, webos-gaming mangohud-toggle
bind = $mod CTRL, G, exec, webos-gaming gamescope
