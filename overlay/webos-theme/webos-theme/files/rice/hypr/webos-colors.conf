# ─────────────────────────────────────────────────────────────────────────────
#  WebOS palette — "Deep Black"
#  Pure black base, translucent surfaces, white accents. Matches KDE Deep Black.
#  Sourced by hyprland.conf. Keep in sync with waybar/style.css and wofi.
# ─────────────────────────────────────────────────────────────────────────────

$base        = rgb(000000)   # pure black
$base_soft   = rgb(0a0a0a)

$surface     = rgba(0000008c)   # 55% black — panels
$surface_hi  = rgba(1c1c1c8c)   # hover / active surface
$surface_lo  = rgba(00000066)   # recessed wells

$text        = rgb(ededed)   # near-white
$text_dim    = rgb(8f8f8f)
$text_faint  = rgb(5b5b5b)

$accent      = rgb(ffffff)   # white: focus/cursor
$accent_soft = rgba(ffffff22)
$accent_glow = rgba(ffffff55)

$border      = rgba(ffffff29)
$border_hi   = rgba(ffffff33)

$urgent      = rgb(d27878)
$warn        = rgb(c8c8c8)
$good        = rgb(b4d2b4)
