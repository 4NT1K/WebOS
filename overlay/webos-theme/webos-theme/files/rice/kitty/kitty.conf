# ─────────────────────────────────────────────────────────────────────────────
#  WebOS kitty — black glass, frosted, monochrome.
#  ~/.config/kitty/kitty.conf
# ─────────────────────────────────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.0
adjust_line_height 115%

# Background: pure black glass. kitty draws the alpha channel itself and the
# compositor window rule leaves kitty's opacity alone (no multiplied alpha).
# dynamic_background_opacity is off so shortcuts/remote control cannot undo it;
# background_blur applies on Wayland when the compositor supports the extension.
background            #000000
foreground            #F2F2F2
background_opacity    0.82
dynamic_background_opacity no
background_blur       24
dim_opacity           0.75

# ── Monochrome palette ──────────────────────────────────────────────────────
# Foreground #F2F2F2, bold/labels #FFFFFF, dim/secondary #8C8C8C.
# ANSI 0-15 mapped to a greyscale ramp (no hue accents).
selection_foreground #000000
selection_background #333333
cursor               #FFFFFF
cursor_text_color    #000000
url_color            #FFFFFF

# black -> white greyscale ramp
color0  #000000
color1  #3a3a3a
color2  #555555
color3  #707070
color4  #8C8C8C
color5  #a0a0a0
color6  #b5b5b5
color7  #d0d0d0
color8  #4a4a4a
color9  #666666
color10 #808080
color11 #999999
color12 #b3b3b3
color13 #cccccc
color14 #e0e0e0
color15 #FFFFFF

# ── Window ──────────────────────────────────────────────────────────────────
hide_window_decorations yes
window_padding_width 18
window_margin_width 0
confirm_os_window_close 0
remember_window_size yes
initial_window_width  1100
initial_window_height 680

# ── Behaviour ───────────────────────────────────────────────────────────────
scrollback_lines 10000
enable_audio_bell no
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 2.0
focus_follows_mouse no
detect_urls yes
open_url_with default
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
active_tab_background   #1a1a1a
inactive_tab_background #0a0a0a
active_tab_foreground   #FFFFFF
inactive_tab_foreground #8C8C8C
tab_activity_symbol 

# ── Cursor: thin white bar, no blink-colour change ──────────────────────────
cursor_shape beam
cursor_beam_thickness 1.2
cursor_blink_interval 0

# ── Performance ─────────────────────────────────────────────────────────────
repaint_delay 8
input_delay 2
sync_to_monitor yes

# ── Shortcuts ───────────────────────────────────────────────────────────────
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# Show the WebOS fastfetch card on every new interactive kitty window.
shell /usr/bin/webos-shell
