# WebOS foot — the lightweight terminal. Translucent, blurred, monochrome.
# ~/.config/foot/foot.ini

[main]
term=foot
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:style=Bold:size=11
dpi-aware=yes
pad=14x14
initial-window-size-pixels=1100x680
# Show the WebOS fastfetch card in every new terminal window.
shell=/usr/bin/webos-shell
# Alpha + blur: Hyprland blurs whatever is behind a translucent surface.
alpha=0.86

[scrollback]
lines=10000
indicator-position=relative
multiplier=3.0

[cursor]
style=beam
blink=yes
color=7dd3fc f0f0f5

[mouse]
hide-when-typing=yes
alternate-scroll-mode=no

[colors]
# Ashen: pure black base, one ice-blue accent.
foreground=f0f0f5
background=050508
selection-foreground=050508
selection-background=7dd3fc
cursor=7dd3fc f0f0f5

regular0=1a1c20
regular1=f87171
regular2=86efac
regular3=fbbf24
regular4=7dd3fc
regular5=c4b5fd
regular6=7dd3fc
regular7=c9ced6

bright0=5b6470
bright1=fca5a5
bright2=bbf7d0
bright3=fde68a
bright4=bae6fd
bright5=ddd6fe
bright6=a5f3fc
bright7=f0f0f5

[csd]
preferred=client
size=0

[bell]
urgent=no
notify=no
visual=no

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
