# WebOS foot — the lightweight terminal. Translucent, blurred, monochrome.
# ~/.config/foot/foot.ini

[main]
term=foot
font=JetBrainsMono Nerd Font:size=11
font-bold=JetBrainsMono Nerd Font:style=Bold:size=11
dpi-aware=yes
pad=14x14
initial-window-size-pixels=1100x680
# Show the WebOS fastfetch card in every new terminal window.
shell=/usr/bin/webos-shell
# Alpha + blur: Hyprland blurs whatever is behind a translucent surface.
alpha=0.78

[scrollback]
lines=10000
indicator-position=relative
multiplier=3.0

[cursor]
style=beam
blink=yes
color=E8E8E8 D8D8D8

[mouse]
hide-when-typing=yes
alternate-scroll-mode=no

[colors]
# Ashen: pure black base, soft-white text and accents, greyscale ANSI ramp.
foreground=D8D8D8
background=000000
selection-foreground=000000
selection-background=E8E8E8
cursor=E8E8E8 D8D8D8

regular0=1a1a1a
regular1=7A7A7A
regular2=999999
regular3=A6A6A6
regular4=C2C2C2
regular5=C2C2C2
regular6=D8D8D8
regular7=D8D8D8

bright0=4A4A4A
bright1=7A7A7A
bright2=A6A6A6
bright3=B8B8B8
bright4=C2C2C2
bright5=D8D8D8
bright6=E8E8E8
bright7=E8E8E8

[csd]
preferred=client
size=0

[bell]
urgent=no
notify=no
visual=no

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
