# ─────────────────────────────────────────────────────────────────────────────
#  WebOS palette — "Ashen"
#  Black base, translucent surfaces, one ice-blue accent. Nothing else.
#  Sourced by hyprland.conf. Keep in sync with waybar/style.css and wofi.
# ─────────────────────────────────────────────────────────────────────────────

$base        = rgb(050508)   # deep black
$base_soft   = rgb(08080b)

$surface     = rgba(0a0a0c99)   # 60% black — panels
$surface_hi  = rgba(14141899)   # hover / active surface
$surface_lo  = rgba(00000066)   # recessed wells

$text        = rgb(f0f0f5)   # white
$text_dim    = rgb(9aa3ad)
$text_faint  = rgb(5b6470)

$accent      = rgb(f0f0f5)   # white: icons + cursor
$accent_soft = rgba(7dd3fc33)
$accent_glow = rgba(7dd3fc66)

$border      = rgba(ffffff14)
$border_hi   = rgba(ffffff2e)

$urgent      = rgb(f87171)
$warn        = rgb(fbbf24)
$good        = rgb(86efac)
