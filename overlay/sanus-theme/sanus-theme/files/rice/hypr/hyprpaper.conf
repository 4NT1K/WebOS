# WebOS hyprpaper — static wallpaper, generated by sanus-wallpaper.
# ~/.config/hypr/hyprpaper.conf

preload = /usr/share/sanus/wallpaper/sanus-wallpaper.png
preload = /usr/share/sanus/wallpaper/sanus-wallpaper-dark.png

wallpaper = ,/usr/share/sanus/wallpaper/sanus-wallpaper.png

splash = false
ipc = on
