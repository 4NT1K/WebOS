# ─────────────────────────────────────────────────────────────────────────────
#  WebOS kitty — black glass, blurred, quiet.
#  ~/.config/kitty/kitty.conf
# ─────────────────────────────────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5
adjust_line_height 108%

# Transparency. Hyprland blurs behind translucent windows.
background            #000000
foreground            #ededed
background_opacity    0.70
dynamic_background_opacity yes
background_blur       1
dim_opacity           0.55

# ── Deep Black palette ──────────────────────────────────────────────────────
selection_foreground #000000
selection_background #ffffff
cursor               #ffffff
cursor_text_color    #000000
url_color            #ffffff

# black
color0  #1a1c20
color8  #5b6470
# red
color1  #f87171
color9  #fca5a5
# green
color2  #86efac
color10 #bbf7d0
# yellow
color3  #fbbf24
color11 #fde68a
# blue
color4  #7dd3fc
color12 #bae6fd
# magenta
color5  #c4b5fd
color13 #ddd6fe
# cyan
color6  #7dd3fc
color14 #a5f3fc
# white
color7  #f0f0f5
color15 #f0f0f5

# ── Window ──────────────────────────────────────────────────────────────────
hide_window_decorations yes
window_padding_width 14
confirm_os_window_close 0
remember_window_size yes
initial_window_width  1100
initial_window_height 680

# ── Behaviour ───────────────────────────────────────────────────────────────
scrollback_lines 10000
enable_audio_bell no
copy_on_select clipboard
strip_trailing_spaces smart
mouse_hide_wait 2.0
focus_follows_mouse no
detect_urls yes
open_url_with default
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
active_tab_background   #08080b
inactive_tab_background #050508
active_tab_foreground   #f0f0f5
inactive_tab_foreground #5b6470
tab_activity_symbol 

# Show system info with WebOS branding on each new terminal

# ── Cursor ──────────────────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0.6
cursor_stop_blinking_after 15

# ── Performance ─────────────────────────────────────────────────────────────
repaint_delay 8
input_delay 2
sync_to_monitor yes

# ── Shortcuts ───────────────────────────────────────────────────────────────
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+left  previous_tab
map ctrl+shift+right next_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# Show system info with WebOS branding on each new kitty window

# Show WebOS fastfetch on each new kitty window
shell /bin/sh -c 'command -v fastfetch >/dev/null 2>&1 && fastfetch; exec "${SHELL:-/bin/bash}"'
