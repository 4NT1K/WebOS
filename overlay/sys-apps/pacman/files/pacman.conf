# WebOS — pacman configuration.
#
# pacman is the application package manager on a WebOS install; the base
# system itself is Gentoo. Arch Linux repositories are the application repo.

[core]
Server = https://mirror.rackspace.com/archlinux/official/core/os/x86_64

[extra]
Server = https://mirror.rackspace.com/archlinux/official/extra/os/x86_64

[multilib]
Server = https://mirror.rackspace.com/archlinux/official/multilib/os/x86_64

[options]
SigLevel = Required DatabaseOptional
Architecture = x86_64
CheckInterval = 0
XferTimeout = 30
NoUpgrade = pacman
