# SanusOS live medium — GRUB configuration.
#
# `@VOLID@` and `@VERSION_FULL@` are substituted by scripts/40-iso.sh; the
# label must match the `--volid` passed to grub-mkrescue, and the live image
# layout (/live/sanus.squashfs) must match mksquashfs_root's output.

set timeout=5
set default=0

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

menuentry "SanusOS @VERSION_FULL@ — Live / Install" {
	linux /boot/vmlinuz-sanus \
		root=live:LABEL=@VOLID@ \
		rd.live.image \
		rd.live.dir=live \
		rd.live.squashimg=sanus.squashfs \
		rd.live.overlay.overlayfs=1 \
		quiet loglevel=3 nowatchdog
	initrd /boot/initramfs-sanus.img
}

menuentry "SanusOS @VERSION_FULL@ — Live (verbose boot)" {
	linux /boot/vmlinuz-sanus \
		root=live:LABEL=@VOLID@ \
		rd.live.image \
		rd.live.dir=live \
		rd.live.squashimg=sanus.squashfs \
		rd.live.overlay.overlayfs=1 \
		loglevel=7 rd.debug
	initrd /boot/initramfs-sanus.img
}

menuentry "SanusOS @VERSION_FULL@ — Live, no KMS (rescue)" {
	linux /boot/vmlinuz-sanus \
		root=live:LABEL=@VOLID@ \
		rd.live.image \
		rd.live.dir=live \
		rd.live.squashimg=sanus.squashfs \
		rd.live.overlay.overlayfs=1 \
		nomodeset quiet loglevel=3
	initrd /boot/initramfs-sanus.img
}

menuentry "Boot from the first hard disk" {
	insmod chain
	insmod part_gpt
	insmod part_msdos
	set root=(hd0)
	chainloader +1
}
