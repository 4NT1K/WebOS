# WebOS live medium — GRUB configuration.
#
# `@VOLID@` and `@VERSION_FULL@` are substituted by scripts/40-iso.sh; the
# label must match the `--volid` passed to grub-mkrescue, and the live image
# layout (/live/webos.squashfs) must match mksquashfs_root's output.

set timeout=5
set default=0

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

menuentry "WebOS @VERSION_FULL@ — Live / Install" {
	linux /boot/vmlinuz-webos \
		root=live:CDLABEL=ISOIMAGE rd.live.label=ISOIMAGE \
		rd.live.image console=tty0 console=ttyS0,115200 \
		rd.live.dir=live \
		rd.live.squashimg=webos.squashfs \
		rd.live.overlay.overlayfs=1 \
		quiet loglevel=3 nowatchdog
	initrd /boot/initramfs-webos.img
}

menuentry "WebOS @VERSION_FULL@ — Live (verbose boot)" {
	linux /boot/vmlinuz-webos \
		root=live:CDLABEL=ISOIMAGE rd.live.label=ISOIMAGE \
		rd.live.image console=tty0 console=ttyS0,115200 \
		rd.live.dir=live \
		rd.live.squashimg=webos.squashfs \
		rd.live.overlay.overlayfs=1 \
		loglevel=7 rd.debug
	initrd /boot/initramfs-webos.img
}

menuentry "WebOS @VERSION_FULL@ — Live, no KMS (rescue)" {
	linux /boot/vmlinuz-webos \
		root=live:CDLABEL=ISOIMAGE rd.live.label=ISOIMAGE \
		rd.live.image console=tty0 console=ttyS0,115200 \
		rd.live.dir=live \
		rd.live.squashimg=webos.squashfs \
		rd.live.overlay.overlayfs=1 \
		nomodeset quiet loglevel=3
	initrd /boot/initramfs-webos.img
}

menuentry "Boot from the first hard disk" {
	insmod chain
	insmod part_gpt
	insmod part_msdos
	set root=(hd0)
	chainloader +1
}
