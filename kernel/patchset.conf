# SanusOS kernel patchset
# ---------------------------------------------------------------------------
# One patch per line.  Fields, pipe separated:
#
#   name | url | sha256 | target-series | description
#
# * name          short identifier, used for the output filename and log lines
# * url           https URL of the .patch / .diff / tarball-of-patches
# * sha256        hex digest, or the literal word  auto  to pin on first fetch
#                 (fetch-patches.sh then rewrites this file with the real hash)
# * target-series kernel series this applies to, e.g. 6.12 (use * for any)
# * description   free text, shown in the build log
#
# SanusOS does NOT ship patch files in git.  They are fetched from their
# upstream projects at build time and hashed, so a rebuild either reproduces
# the exact kernel or fails loudly.  Run `kernel/fetch-patches.sh --verify`
# in CI to check for upstream rewrites.
#
# Anything not listed here is deliberately *not* applied.  We would rather run
# a stock LTS kernel than carry a patch we cannot explain.
# ---------------------------------------------------------------------------

# --- CPU scheduler ----------------------------------------------------------
# BORE (Burst-Oriented Response Enhancer): the interactive-desktop scheduler
# CachyOS also ships.  Big win for frametime consistency under load.
# bore|https://github.com/firelzrd/bore-scheduler/releases/download/v6.12.0/bore-6.12.0.patch|auto|6.12|BORE scheduler for 6.12 LTS (URL outdated/unavailable; disabled)

# --- Synchronisation primitives (Wine/Proton latency) ----------------------
# fsync: fast futex-based sync for Wine.  Cut frame hitching in Proton titles.
# fsync|https://github.com/Frogging-Family/community-patches/raw/master/wine-tkg-git/valve-fsync/0001-fsync.patch|auto|6.12|Wine fsync futex interface (URL outdated/unavailable; disabled)
# ntsync: the NT synchronisation primitives that replaced fsync upstream.
# Mainline in 6.14; backported here so we can ship an LTS base.
# ntsync|https://github.com/CachyOS/kernel-patches/raw/master/6.12/0001-ntsync.patch|auto|6.12|NT sync primitives (backport) (URL outdated/unavailable; disabled)

# --- Networking -------------------------------------------------------------
# BBRv3: better throughput and latency on lossy links (game downloads).
# bbr3|https://github.com/CachyOS/kernel-patches/raw/master/6.12/0001-net-tcp-bbr3.patch|auto|6.12|TCP BBRv3 congestion control (URL outdated/unavailable; disabled)
# CAKE / fq_codel are mainline; we only tune defaults in the config fragment.

# --- Hardware support -------------------------------------------------------
# AMD P-State preferred-core ranking: better boost on Ryzen 9000/7000 X3D.
# amd-pstate-epp|https://github.com/CachyOS/kernel-patches/raw/master/6.12/0001-amd-pstate.patch|auto|6.12|AMD P-State EPP + preferred cores (URL outdated/unavailable; disabled)
# OpenRGB / i2c-piix4 SMBus unlock, for RGB control without a userspace driver.
# openrgb|https://github.com/CachyOS/kernel-patches/raw/master/6.12/0001-i2c-piix4.patch|auto|6.12|i2c-piix4 SMBus for OpenRGB (URL outdated/unavailable; disabled)

# --- Storage / memory -------------------------------------------------------
# le9uo / multigenerational LRU tuning knobs used by ananicy-cpp and friends.
# mglru-knobs|https://github.com/CachyOS/kernel-patches/raw/master/6.12/0001-mm-mglru.patch|auto|6.12|MGLRU sysctl knobs (URL outdated/unavailable; disabled)

# --- Optional: Clear Linux performance patches ------------------------------
# Off by default: they are large, opinionated, and rebased slowly.  Flip
# enabled=1 below and add the matching entries if you want them.
#clear-linux|https://github.com/clearlinux-pkgs/linux/raw/main/0001-clearlinux.patch|auto|6.12|Clear Linux performance patches
